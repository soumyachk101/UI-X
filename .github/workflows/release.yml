name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@fe03b94eaf0214406914dbc90713538f150f830e
      - uses: actions/setup-node@1d0f469a1153312dd84a79db3743260b85f11789
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - uses: softprops/action-gh-release@c062e08bd532815e2082a85e87efff09074f09e5 # v2.1.0
        with:
          generate_release_notes: true
      - uses: JS-DevTools/npm-publish@a528d066b203bb6a4b3d4a24ca07328115b71ee5 # v3.1.0
        with:
          token: ${{ secrets.NPM_TOKEN }}
          package: "./packages/cli/package.json"
      - uses: JS-DevTools/npm-publish@a528d066b203bb6a4b3d4a24ca07328115b71ee5
        with:
          token: ${{ secrets.NPM_TOKEN }}
          package: "./packages/mcp-server/package.json"
